<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Início</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="container">
    <h1 id="boas-vindas">Carregando...</h1>

    <div class="atalhos">
      <a class="atalho" href="/produtos.html">
        <strong>Cadastrar produto</strong>
        <span>Adicione novos produtos ao catálogo</span>
      </a>
      <a class="atalho" href="/estoque.html">
        <strong>Registrar entrada de estoque</strong>
        <span>Some as mercadorias que chegaram</span>
      </a>
      <a class="atalho" href="/vendas.html">
        <strong>Registrar venda</strong>
        <span>Dê baixa no estoque e veja o valor total</span>
      </a>
    </div>
  </main>

  <script src="/menu.js"></script>
  <script>
    fetch('/api/me')
      .then((r) => r.json())
      .then((usuario) => {
        document.getElementById('boas-vindas').textContent = 'Olá, ' + usuario.nome + '!';
      });
  </script>
</body>
</html>
