<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Cadastrar Produto</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 32px; }
    .caixa { background: #fff; padding: 24px; border-radius: 8px; max-width: 420px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .botoes { display: flex; gap: 8px; margin-top: 20px; }
    button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    #cadastrar { background: #2563eb; color: #fff; }
    #cancelar { background: #e5e7eb; }
    #mensagem { margin-top: 12px; font-size: 14px; min-height: 18px; }
    .erro { color: #b91c1c; }
    .sucesso { color: #15803d; }
    table { border-collapse: collapse; margin-top: 24px; background: #fff; }
    th, td { border: 1px solid #d1d5db; padding: 6px 12px; font-size: 14px; text-align: left; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>Cadastrar Produto</h1>
    <form id="formulario">
      <label for="nome">Nome</label>
      <input id="nome">
      <label for="sku">Código (SKU)</label>
      <input id="sku">
      <label for="categoria">Categoria</label>
      <input id="categoria">
      <label for="quantidade">Quantidade inicial</label>
      <input id="quantidade" type="number" min="0" step="1">
      <label for="preco">Preço (R$)</label>
      <input id="preco" type="number" min="0" step="0.01">
      <div class="botoes">
        <button type="submit" id="cadastrar">Cadastrar</button>
        <button type="button" id="cancelar">Cancelar</button>
      </div>
      <div id="mensagem"></div>
    </form>
  </div>

  <table>
    <thead>
      <tr><th>Nome</th><th>SKU</th><th>Categoria</th><th>Qtd</th><th>Preço</th></tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <script>
    const formulario = document.getElementById('formulario');
    const mensagem = document.getElementById('mensagem');
    const lista = document.getElementById('lista');

    function mostrar(texto, classe) {
      mensagem.textContent = texto;
      mensagem.className = classe;
    }

    async function carregarLista() {
      const resposta = await fetch('/api/produtos');
      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      const produtos = await resposta.json();
      lista.innerHTML = '';
      produtos.forEach((p) => {
        const linha = document.createElement('tr');
        [p.nome, p.sku, p.categoria, p.quantidade, Number(p.preco).toFixed(2)].forEach((valor) => {
          const celula = document.createElement('td');
          celula.textContent = valor;
          linha.appendChild(celula);
        });
        lista.appendChild(linha);
      });
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrar('', '');

      const resposta = await fetch('/api/produtos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('nome').value,
          sku: document.getElementById('sku').value,
          categoria: document.getElementById('categoria').value,
          quantidade: document.getElementById('quantidade').value,
          preco: document.getElementById('preco').value,
        }),
      });

      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }

      const dados = await resposta.json();
      if (resposta.ok) {
        mostrar('Produto "' + dados.nome + '" cadastrado com sucesso!', 'sucesso');
        formulario.reset();
        carregarLista();
      } else {
        mostrar(dados.erro, 'erro');
      }
    });

    document.getElementById('cancelar').addEventListener('click', () => {
      formulario.reset();
      window.location.href = '/inicio.html';
    });

    carregarLista();
  </script>
</body>
</html>
