<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Cadastrar Produto</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="container">
    <h1>Cadastrar Produto</h1>

    <div class="card estreito">
      <form id="formulario">
        <label for="nome">Nome</label>
        <input id="nome">
        <label for="sku">Código (SKU)</label>
        <input id="sku">
        <label for="categoria">Categoria</label>
        <input id="categoria">
        <label for="quantidade">Quantidade inicial</label>
        <input id="quantidade" type="number" min="0" step="1">
        <label for="preco">Preço (R$)</label>
        <input id="preco" type="number" min="0" step="0.01">
        <div class="botoes">
          <button type="submit" id="cadastrar" class="primario">Cadastrar</button>
          <button type="button" id="cancelar" class="secundario">Cancelar</button>
        </div>
        <div id="mensagem"></div>
      </form>
    </div>

    <div class="card">
      <h2>Produtos cadastrados</h2>
      <table>
        <thead>
          <tr><th>Nome</th><th>SKU</th><th>Categoria</th><th>Qtd</th><th>Preço</th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <script src="/menu.js"></script>
  <script>
    const formulario = document.getElementById('formulario');
    const mensagem = document.getElementById('mensagem');
    const lista = document.getElementById('lista');

    function mostrar(texto, classe) {
      mensagem.textContent = texto;
      mensagem.className = classe;
    }

    function formatarReais(valor) {
      return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
    }

    async function carregarLista() {
      const resposta = await fetch('/api/produtos');
      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      const produtos = await resposta.json();
      lista.innerHTML = '';
      produtos.forEach((p) => {
        const linha = document.createElement('tr');
        [p.nome, p.sku, p.categoria, p.quantidade, formatarReais(p.preco)].forEach((valor) => {
          const celula = document.createElement('td');
          celula.textContent = valor;
          linha.appendChild(celula);
        });
        lista.appendChild(linha);
      });
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrar('', '');

      const resposta = await fetch('/api/produtos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('nome').value,
          sku: document.getElementById('sku').value,
          categoria: document.getElementById('categoria').value,
          quantidade: document.getElementById('quantidade').value,
          preco: document.getElementById('preco').value,
        }),
      });

      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }

      const dados = await resposta.json();
      if (resposta.ok) {
        mostrar('Produto "' + dados.nome + '" cadastrado com sucesso!', 'sucesso');
        formulario.reset();
        carregarLista();
      } else {
        mostrar(dados.erro, 'erro');
      }
    });

    document.getElementById('cancelar').addEventListener('click', () => {
      formulario.reset();
      window.location.href = '/inicio.html';
    });

    carregarLista();
  </script>
</body>
</html>
