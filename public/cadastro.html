<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Criar conta</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="container">
    <h1>Criar conta</h1>

    <div class="card estreito">
      <p>Crie a conta do seu negócio. Quem cria a conta se torna o <strong>administrador</strong> e depois pode cadastrar os funcionários.</p>
      <form id="formulario">
        <label for="nome">Nome</label>
        <input id="nome">
        <label for="email">E-mail</label>
        <input id="email" type="email">
        <label for="senha">Senha (mínimo 8 caracteres)</label>
        <input id="senha" type="password">
        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" type="password">
        <div class="botoes">
          <button type="submit" class="primario">Criar conta</button>
          <button type="button" id="voltar" class="secundario">Já tenho conta</button>
        </div>
        <div id="mensagem"></div>
      </form>
    </div>
  </main>

  <script>
    const formulario = document.getElementById('formulario');
    const mensagem = document.getElementById('mensagem');

    function mostrar(texto, classe) {
      mensagem.textContent = texto;
      mensagem.className = classe;
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrar('', '');

      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;
      if (senha !== confirmar) {
        mostrar('As senhas não conferem.', 'erro');
        return;
      }

      const resposta = await fetch('/api/usuarios/cadastro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value,
          senha: senha,
        }),
      });

      const dados = await resposta.json();
      if (resposta.ok) {
        window.location.href = '/inicio.html';
      } else {
        mostrar(dados.erro, 'erro');
      }
    });

    document.getElementById('voltar').addEventListener('click', () => {
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
