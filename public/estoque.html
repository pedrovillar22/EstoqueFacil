<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Registrar entrada de estoque</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="container">
    <h1>Registrar entrada de estoque</h1>

    <div class="card estreito">
      <form id="formulario">
        <label for="codigo_barras">Código de barras (opcional)</label>
        <input id="codigo_barras" maxlength="50" inputmode="numeric" autocomplete="off" placeholder="Leia o código com o leitor ou digite e pressione Enter">
        <div id="aviso-codigo" style="font-size: 13px; margin: 4px 0 8px; min-height: 18px;"></div>

        <label for="produto">Produto</label>
        <select id="produto">
          <option value="">Selecione um produto</option>
        </select>
        <label for="quantidade">Quantidade recebida</label>
        <input id="quantidade" type="number" min="1" step="1">
        <label for="observacao">Observação (opcional)</label>
        <input id="observacao" maxlength="255">
        <div class="botoes">
          <button type="submit" id="registrar" class="primario">Registrar entrada</button>
          <button type="button" id="cancelar" class="secundario">Cancelar</button>
        </div>
        <div id="mensagem"></div>
      </form>
    </div>

    <div class="card">
      <h2>Estoque atual</h2>
      <table>
        <thead>
          <tr><th>Nome</th><th>SKU</th><th>Código de barras</th><th>Categoria</th><th>Quantidade atual</th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <script src="/menu.js"></script>
  <script>
    const formulario = document.getElementById('formulario');
    const mensagem = document.getElementById('mensagem');
    const lista = document.getElementById('lista');
    const selectProduto = document.getElementById('produto');
    const botaoRegistrar = document.getElementById('registrar');
    const campoQuantidade = document.getElementById('quantidade');
    const campoCodigo = document.getElementById('codigo_barras');
    const avisoCodigo = document.getElementById('aviso-codigo');
    campoQuantidade.addEventListener('wheel', () => campoQuantidade.blur());

    let produtos = [];

    function mostrar(texto, classe) {
      mensagem.textContent = texto;
      mensagem.className = classe;
    }

    function avisarCodigo(texto, cor) {
      avisoCodigo.textContent = texto;
      avisoCodigo.style.color = cor || '#64748b';
    }

    function produtoDoCodigo(codigo) {
      return produtos.find((p) => p.codigo_barras === codigo)
        || produtos.find((p) => p.sku.toLowerCase() === codigo.toLowerCase());
    }

    function buscarPorCodigo() {
      const codigo = campoCodigo.value.trim();
      if (!codigo) return;

      const produto = produtoDoCodigo(codigo);

      if (!produto) {
        avisarCodigo('Nenhum produto encontrado com o código "' + codigo + '".', '#c0392b');
        campoCodigo.select();
        return;
      }

      selectProduto.value = produto.id;
      avisarCodigo('Produto selecionado pelo código: ' + produto.nome + '.', '#15803d');
      campoQuantidade.focus();
    }

    // O leitor de código de barras envia Enter ao final da leitura
    campoCodigo.addEventListener('keydown', (evento) => {
      if (evento.key === 'Enter') {
        evento.preventDefault();
        buscarPorCodigo();
      }
    });

    campoCodigo.addEventListener('input', () => avisarCodigo(''));

    // Se o produto for trocado manualmente e o código digitado não for dele, o código é limpo
    selectProduto.addEventListener('change', () => {
      const codigo = campoCodigo.value.trim();
      if (!codigo) return;
      const produto = produtoDoCodigo(codigo);
      if (!produto || String(produto.id) !== selectProduto.value) {
        campoCodigo.value = '';
        avisarCodigo('O código de barras foi limpo porque o produto foi alterado manualmente.', '#b45309');
      }
    });

    async function carregarProdutos() {
      const resposta = await fetch('/api/produtos');
      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      produtos = await resposta.json();

      const escolhido = selectProduto.value;
      selectProduto.innerHTML = '<option value="">Selecione um produto</option>';
      lista.innerHTML = '';

      produtos.forEach((p) => {
        const opcao = document.createElement('option');
        opcao.value = p.id;
        opcao.textContent = p.nome + ' (' + p.sku + ')';
        selectProduto.appendChild(opcao);

        const linha = document.createElement('tr');
        [p.nome, p.sku, p.codigo_barras || '-', p.categoria, p.quantidade + ' ' + p.unidade_medida].forEach((valor) => {
          const celula = document.createElement('td');
          celula.textContent = valor;
          linha.appendChild(celula);
        });
        lista.appendChild(linha);
      });

      selectProduto.value = escolhido;
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrar('', '');

      // Confere se o código de barras digitado corresponde ao produto selecionado
      const codigo = campoCodigo.value.trim();
      if (codigo) {
        const produtoCodigo = produtoDoCodigo(codigo);
        if (!produtoCodigo) {
          mostrar('Nenhum produto foi encontrado com o código informado. Corrija ou limpe o campo de código de barras.', 'erro');
          campoCodigo.focus();
          return;
        }
        if (!selectProduto.value) {
          selectProduto.value = produtoCodigo.id;
        } else if (String(produtoCodigo.id) !== selectProduto.value) {
          mostrar('O código de barras informado pertence ao produto "' + produtoCodigo.nome + '", mas o produto selecionado é outro. Corrija o código ou limpe o campo.', 'erro');
          campoCodigo.focus();
          return;
        }
      }

      if (botaoRegistrar.disabled) return;
      botaoRegistrar.disabled = true;
      const qtdEnviada = campoQuantidade.value;
      const recebido = produtos.find((p) => String(p.id) === selectProduto.value);
      const unidade = recebido ? recebido.unidade_medida : 'un';

      const resposta = await fetch('/api/estoque/entrada', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          produto_id: selectProduto.value,
          quantidade: document.getElementById('quantidade').value,
          observacao: document.getElementById('observacao').value,
        }),
      });

      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }

      const dados = await resposta.json();
      botaoRegistrar.disabled = false;
      if (resposta.ok) {
        mostrar('Entrada registrada com sucesso. Foram adicionados ' + qtdEnviada + ' ' + unidade + ' ao produto "' + dados.nome + '". Estoque atual: ' + dados.quantidade + ' ' + unidade + '.', 'sucesso');
        formulario.reset();
        avisarCodigo('');
        await carregarProdutos();
        campoCodigo.focus();
      } else {
        mostrar(dados.erro, 'erro');
      }
    });

    document.getElementById('cancelar').addEventListener('click', () => {
      formulario.reset();
      window.location.href = '/dashboard.html';
    });

    carregarProdutos();
  </script>
</body>
</html>
