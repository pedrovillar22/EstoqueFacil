<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Entrar</title>
  <link rel="stylesheet" href="/estilo.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login { width: 360px; }
    .login h1 { text-align: center; color: #1e3a5f; margin-bottom: 4px; }
    .login .subtitulo { text-align: center; color: #64748b; font-size: 14px; margin: 0 0 8px; }
    .login button { width: 100%; }
  </style>
</head>
<body>
  <div class="card login">
    <h1>EstoqueFácil</h1>
    <p class="subtitulo">Entre para gerenciar seu estoque</p>
    <form id="formulario">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
      <div class="botoes">
        <button type="submit" class="primario">Entrar</button>
      </div>
      <div id="erro"></div>
    </form>
  </div>

  <script>
    const formulario = document.getElementById('formulario');
    const erro = document.getElementById('erro');

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      erro.textContent = '';

      const resposta = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
        }),
      });

      if (resposta.ok) {
        window.location.href = '/inicio.html';
      } else {
        const dados = await resposta.json();
        erro.textContent = dados.erro;
      }
    });
  </script>
</body>
</html>
