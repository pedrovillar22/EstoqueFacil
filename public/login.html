<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Entrar</title>
  <link rel="stylesheet" href="/estilo.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login { width: 360px; }
    .login h1 { text-align: center; color: #1e3a5f; margin-bottom: 4px; }
    .login .subtitulo { text-align: center; color: #64748b; font-size: 14px; margin: 0 0 8px; }
    .login button { width: 100%; }

    .campo-senha { position: relative; }
    .campo-senha input { padding-right: 48px; box-sizing: border-box; }
    .login .olho {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      margin: 0;
      padding: 6px 8px;
      background: none;
      border: none;
      box-shadow: none;
      cursor: pointer;
      color: #64748b;
      z-index: 5;
      line-height: 0;
    }
    .login .olho:hover { color: #1e3a5f; }
    .login .olho svg { width: 22px; height: 22px; display: block; pointer-events: none; }
  </style>
</head>
<body>
  <div class="card login">
    <h1>EstoqueFácil</h1>
    <p class="subtitulo">Entre para gerenciar seu estoque</p>
    <form id="formulario">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input type="password" id="senha" required>
        <button type="button" class="olho" id="olho" onclick="alternarSenha()" title="Mostrar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <div class="botoes">
        <button type="submit" class="primario">Entrar</button>
      </div>
      <div id="erro"></div>
    </form>
  </div>

  <script>
    var ICONE_VISIVEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    var ICONE_OCULTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

    function alternarSenha() {
      var campo = document.getElementById('senha');
      var botao = document.getElementById('olho');
      if (campo.type === 'password') {
        campo.type = 'text';
        botao.innerHTML = ICONE_OCULTO;
        botao.title = 'Ocultar senha';
      } else {
        campo.type = 'password';
        botao.innerHTML = ICONE_VISIVEL;
        botao.title = 'Mostrar senha';
      }
    }
  </script>

  <script>
    const formulario = document.getElementById('formulario');
    const erro = document.getElementById('erro');

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      erro.textContent = '';

      const resposta = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
        }),
      });

      if (resposta.ok) {
        window.location.href = '/inicio.html';
      } else {
        const dados = await resposta.json();
        erro.textContent = dados.erro;
      }
    });
  </script>
</body>
</html>
