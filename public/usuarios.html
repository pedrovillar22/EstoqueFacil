<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueFácil - Usuários</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="container">
    <h1>Usuários</h1>

    <div class="card estreito" id="aviso-funcionario" style="display: none;">
      <p><strong>Apenas o administrador pode cadastrar e consultar usuários.</strong></p>
    </div>

    <div id="area-admin" style="display: none;">
      <div class="card estreito">
        <h2>Cadastrar funcionário</h2>
        <form id="formulario">
          <label for="nome">Nome</label>
          <input id="nome">
          <label for="email">E-mail</label>
          <input id="email" type="email">
          <label for="senha">Senha (mínimo 8 caracteres)</label>
          <input id="senha" type="password">
          <div class="botoes">
            <button type="submit" class="primario">Cadastrar funcionário</button>
            <button type="button" id="cancelar" class="secundario">Cancelar</button>
          </div>
          <div id="mensagem"></div>
        </form>
      </div>

      <div class="card">
        <h2>Usuários cadastrados</h2>
        <table>
          <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Criado em</th></tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/menu.js"></script>
  <script>
    const formulario = document.getElementById('formulario');
    const mensagem = document.getElementById('mensagem');
    const lista = document.getElementById('lista');

    function mostrar(texto, classe) {
      mensagem.textContent = texto;
      mensagem.className = classe;
    }

    function nomeDoPerfil(perfil) {
      return perfil === 'administrador' ? 'Administrador' : 'Funcionário';
    }

    async function carregarLista() {
      const resposta = await fetch('/api/usuarios');
      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      if (!resposta.ok) {
        return;
      }
      const usuarios = await resposta.json();
      lista.innerHTML = '';
      usuarios.forEach((u) => {
        const linha = document.createElement('tr');
        [
          u.nome,
          u.email,
          nomeDoPerfil(u.perfil),
          new Date(u.criado_em).toLocaleDateString('pt-BR'),
        ].forEach((valor) => {
          const celula = document.createElement('td');
          celula.textContent = valor;
          linha.appendChild(celula);
        });
        lista.appendChild(linha);
      });
    }

    fetch('/api/me')
      .then((r) => {
        if (r.status === 401) {
          window.location.href = '/login.html';
          return null;
        }
        return r.json();
      })
      .then((usuario) => {
        if (!usuario) return;
        if (usuario.perfil === 'administrador') {
          document.getElementById('area-admin').style.display = 'block';
          carregarLista();
        } else {
          document.getElementById('aviso-funcionario').style.display = 'block';
        }
      });

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrar('', '');

      const resposta = await fetch('/api/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
        }),
      });

      if (resposta.status === 401) {
        window.location.href = '/login.html';
        return;
      }

      const dados = await resposta.json();
      if (resposta.ok) {
        mostrar('Funcionário "' + dados.nome + '" cadastrado com sucesso!', 'sucesso');
        formulario.reset();
        carregarLista();
      } else {
        mostrar(dados.erro, 'erro');
      }
    });

    document.getElementById('cancelar').addEventListener('click', () => {
      formulario.reset();
      window.location.href = '/inicio.html';
    });
  </script>
</body>
</html>
